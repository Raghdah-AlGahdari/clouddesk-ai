<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My tickets | CloudDesk AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.svg" type="image/svg+xml">

</head>

<body>
    <div class="app">
        <nav class="sidebar">
            <div class="logo">
                <img src="logo.svg" alt="" width="32" height="32">
                <span>CloudDesk AI</span>
            </div>
            <ul class="nav-links">
                <li><a href="tickets.html" class="active">My Tickets</a></li>
                <li><a href="#">Admin panel</a></li>
                <li><a href="#">Dashboard</a></li>
            </ul>
            <button id="logoutButton" class="btn-secondary">Log out</button>
        </nav>
        <main class="content">
            <h1>My tickets</h1>
            <p>Welcome to your tickets page!</p>
            <div class="content-grid">
                <section class="card">
                    <h2>Your Tickets</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Ticket</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Category</th>
                            </tr>
                        </thead>
                        <tbody id="ticketList"></tbody>
                    </table>
                </section>
                <section class="card">
                    <form id="ticketForm">
                        <h2>Create a new ticket</h2>
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" required>

                        <label for="description">Description:</label>
                        <textarea id="description" name="description" required></textarea>

                        <label for="category">Category</label>
                        <select id="category" name="category_id" required>
                            <option value="">Choose a category</option>
                        </select>

                        <label for="priority">Priority:</label>
                        <select id="priority" name="priority" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>

                        <button type="submit">Create Ticket</button>
                        <p id="message"></p>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
